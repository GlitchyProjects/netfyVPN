name: Build netfyVPN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Prepare Native Core & Dependencies
        run: |
          make android-prepare

      - name: Build Android APKs (Split per ABI & Universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Organize APK Artifacts
        run: |
          mkdir -p output_apks
          find build/app/outputs/flutter-apk/ -name "*arm64-v8a*.apk" -exec cp {} output_apks/netfyVPN-arm64-v8a.apk \;
          find build/app/outputs/flutter-apk/ -name "*armeabi-v7a*.apk" -exec cp {} output_apks/netfyVPN-armeabi-v7a.apk \;
          find build/app/outputs/flutter-apk/ -name "app-release.apk" -exec cp {} output_apks/netfyVPN-universal.apk \;
          ls -la output_apks/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netfyVPN-Android-APKs
          path: output_apks/*.apk
          retention-days: 14
